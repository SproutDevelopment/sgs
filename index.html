            } else {
                currentDeck = data;
                document.getElementById('pile-count').innerText = currentDeck.length;
            }
        });

        // 洗牌演算法 (Fisher-Yates shuffle)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 初始化或重置牌堆
        function initOrResetDeck() {
            if (confirm("確定要重新洗牌並重置所有人的牌堆嗎？")) {
                let shuffled = shuffle([...masterDeckData]);
                deckRef.set(shuffled);
                document.getElementById('result-container').classList.add('hidden');
                alert("牌堆已重新隨機洗牌！");
            }
        }

        // 抽牌功能 (top = 頂部, bottom = 底部)
        function drawCard(position) {
            deckRef.transaction((deck) => {
                if (!deck || deck.length === 0) return deck;
                
                let card;
                if (position === 'top') {
                    card = deck.shift(); // 從陣列頭部拿
                } else {
                    card = deck.pop();   // 從陣列尾部拿
                }
                
                // 暫存抽出的卡牌以便在交易完成後顯示
                window.lastDrawnCard = card;
                return deck;
            }, (error, committed, snapshot) => {
                if (committed && window.lastDrawnCard) {
                    displayDrawnCard(window.lastDrawnCard);
                } else {
                    alert("牌堆已經空了！請點擊「強制重洗整副牌」。");
                }
            });
        }

        // 顯示摸到的卡牌
        function displayDrawnCard(card) {
            const container = document.getElementById('result-container');
            const display = document.getElementById('drawn-card-display');
            container.classList.remove('hidden');

            let colorClass = (card.suit === '紅桃' || card.suit === '方塊') ? 'text-red-500' : 'text-slate-200';
            
            display.innerHTML = `
                <div class="text-2xl font-black ${colorClass}">${card.suit} ${card.num}</div>
                <div class="text-xl font-bold text-amber-300 my-1">${card.name}</div>
                <div class="text-xs text-slate-400 bg-slate-800 px-2 py-1 rounded inline-block">${card.type}</div>
            `;
        }

        // 檢視 X 張牌
        function viewCards(position) {
            currentViewMode = position;
            const inputId = position === 'top' ? 'top-x-input' : 'bottom-x-input';
            let x = parseInt(document.getElementById(inputId).value);

            if (isNaN(x) || x <= 0) {
                alert("請輸入有效的正整數！");
                return;
            }
            if (currentDeck.length === 0) {
                alert("牌堆目前是空的！");
                return;
            }

            x = Math.min(x, currentDeck.length);

            // 擷取對應的子陣列
            let targetCards = [];
            if (position === 'top') {
                targetCards = currentDeck.slice(0, x);
            } else {
                targetCards = currentDeck.slice(currentDeck.length - x);
            }

            renderModalList(targetCards, position);
            document.getElementById('modal').classList.remove('hidden');
        }

        // 渲染彈窗內的卡牌順序調整清單
        function renderModalList(cards, position) {
            const title = document.getElementById('modal-title');
            title.innerText = position === 'top' ? `檢視並調整牌堆頂的 ${cards.length} 張牌` : `檢視並調整牌堆底的 ${cards.length} 張牌`;

            const listContainer = document.getElementById('modal-card-list');
            listContainer.innerHTML = '';

            cards.forEach((card, index) => {
                let colorClass = (card.suit === '紅桃' || card.suit === '方塊') ? 'text-red-400' : 'text-slate-300';
                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-slate-900 p-3 rounded border border-slate-700 card-item";
                item.dataset.card = JSON.stringify(card);

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-500 font-mono">#${index + 1}</span>
                        <span class="font-bold ${colorClass}">${card.suit} ${card.num}</span>
                        <span class="text-white">${card.name}</span>
                        <span class="text-xs text-slate-400">(${card.type})</span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="moveItem(this, 'up')" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 text-xs rounded">⬆️</button>
                        <button onclick="moveItem(this, 'down')" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 text-xs rounded">⬇️</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        // 上下移動按鈕邏輯
        function moveItem(btn, direction) {
            const item = btn.closest('.card-item');
            if (direction === 'up' && item.previousElementSibling) {
                item.parentNode.insertBefore(item, item.previousElementSibling);
            } else if (direction === 'down' && item.nextElementSibling) {
                item.parentNode.insertBefore(item.nextElementSibling, item);
            }
        }

        // 關閉彈窗
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        // 儲存修改後的卡牌順序
        function saveCardOrder() {
            const items = document.querySelectorAll('#modal-card-list .card-item');
            let modifiedSubList = Array.from(items).map(item => JSON.parse(item.dataset.card));

            let newDeck = [...currentDeck];
            let x = modifiedSubList.length;

            if (currentViewMode === 'top') {
                // 取代牌堆前端
                newDeck.splice(0, x, ...modifiedSubList);
            } else {
                // 取代牌堆尾端
                newDeck.splice(newDeck.length - x, x, ...modifiedSubList);
            }

            // 寫回 Firebase，同步
            deckRef.set(newDeck).then(() => {
                alert("牌序已成功更新並同步給所有人！");
                closeModal();
            }).catch(error => {
                alert("更新失敗：" + error.message);
            });
        }
    </script>
</body>
</html>
