<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>三國殺共用牌堆與玩家狀態模擬器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">

    <div class="max-w-5xl mx-auto space-y-6">
        <!-- 標題與牌堆狀態 -->
        <header class="text-center bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <h1 class="text-3xl font-bold text-amber-400 mb-2">三國殺桌面模擬系統</h1>
            <p class="text-slate-400">目前牌堆剩餘張數：<span id="pile-count" class="text-white font-bold text-xl">載入中...</span></p>
            <div id="error-msg" class="text-red-400 text-sm mt-2 font-bold"></div>
            <div class="mt-4 flex justify-center gap-4">
                <button onclick="initOrResetDeck()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-bold transition">強制重洗整副牌 (161張)</button>
            </div>
        </header>

        <!-- 頁籤切換 -->
        <div class="flex border-b border-slate-700 gap-2">
            <button onclick="switchTab('my-desk')" id="tab-btn-my-desk" class="px-5 py-2.5 font-bold text-amber-400 border-b-2 border-amber-400 transition">我的桌面與手牌</button>
            <button onclick="switchTab('players-status')" id="tab-btn-players-status" class="px-5 py-2.5 font-bold text-slate-400 hover:text-white transition">🔍 查看所有人狀態</button>
        </div>

        <!-- ================= 區塊 1：我的桌面與手牌 ================= -->
        <div id="tab-my-desk" class="space-y-6">
            <!-- 玩家識別設定 -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <label class="text-sm font-bold text-slate-300 whitespace-nowrap">您的玩家名稱：</label>
                    <input type="text" id="player-name-input" value="玩家1" onchange="updatePlayerProfile()" class="bg-slate-900 border border-slate-600 rounded px-3 py-1 text-white font-bold w-full sm:w-48">
                </div>
                <button onclick="resetMyStatus()" class="bg-amber-700 hover:bg-amber-600 text-white px-4 py-1.5 rounded text-sm font-bold transition w-full sm:w-auto">重置我的血量/裝備/手牌</button>
            </div>

            <!-- 血量與裝備欄 (玩家狀態面板) -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 血量系統 -->
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col justify-between space-y-4">
                    <h2 class="text-lg font-semibold text-amber-300">血量系統 (Health)</h2>
                    <div class="flex items-center gap-3 justify-center">
                        <input type="number" id="hp-current" value="4" min="0" onchange="updatePlayerProfile()" class="bg-slate-900 border border-slate-600 rounded px-3 py-2 w-24 text-center text-xl font-bold text-emerald-400">
                        <span class="text-2xl font-bold text-slate-500">/</span>
                        <input type="number" id="hp-max" value="4" min="1" onchange="updatePlayerProfile()" class="bg-slate-900 border border-slate-600 rounded px-3 py-2 w-24 text-center text-xl font-bold text-white">
                    </div>
                    <p class="text-xs text-slate-400 text-center">格式：當前血量 / 最大血量 (數值變動會即時同步)</p>
                </div>

                <!-- 裝備欄 (上限 5 張) -->
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col justify-between space-y-3">
                    <div class="flex justify-between items-center">
                        <h2 class="text-lg font-semibold text-amber-300">裝備欄 (上限 5)</h2>
                        <span id="equip-count" class="text-xs bg-slate-900 px-2 py-1 rounded text-slate-400">0 / 5</span>
                    </div>
                    <div id="equipment-container" class="grid grid-cols-5 gap-2 bg-slate-900 p-3 rounded-lg border border-slate-700 min-h-[75px] items-center">
                        <p class="text-slate-500 col-span-full text-center text-xs">尚無裝備</p>
                    </div>
                    <button onclick="openEquipSelectModal()" class="w-full bg-slate-700 hover:bg-slate-600 text-amber-300 text-xs py-1.5 rounded font-bold transition">+ 裝備新武器/防具/寶物</button>
                </div>
            </div>

            <!-- 摸牌操作面板 -->
            <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- 牌堆頂 -->
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col space-y-3">
                    <h2 class="text-lg font-semibold text-amber-300 text-center">牌堆頂操作</h2>
                    <div class="flex gap-2">
                        <input type="number" id="draw-top-count" min="1" value="1" class="bg-slate-900 border border-slate-600 rounded px-3 py-1 w-20 text-center text-white">
                        <button onclick="drawCards('top')" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-2 rounded font-bold transition">從牌堆頂摸牌</button>
                    </div>
                    <div class="flex gap-2 pt-2 border-t border-slate-700">
                        <input type="number" id="top-x-input" min="1" value="5" class="bg-slate-900 border border-slate-600 rounded px-3 py-1 w-full text-center text-white">
                        <button onclick="viewCards('top')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1 rounded font-bold whitespace-nowrap transition">檢視並改序</button>
                    </div>
                </div>

                <!-- 牌堆底 -->
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col space-y-3">
                    <h2 class="text-lg font-semibold text-amber-300 text-center">牌堆底操作</h2>
                    <div class="flex gap-2">
                        <input type="number" id="draw-bottom-count" min="1" value="1" class="bg-slate-900 border border-slate-600 rounded px-3 py-1 w-20 text-center text-white">
                        <button onclick="drawCards('bottom')" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-2 rounded font-bold transition">從牌堆底摸牌</button>
                    </div>
                    <div class="flex gap-2 pt-2 border-t border-slate-700">
                        <input type="number" id="bottom-x-input" min="1" value="5" class="bg-slate-900 border border-slate-600 rounded px-3 py-1 w-full text-center text-white">
                        <button onclick="viewCards('bottom')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1 rounded font-bold whitespace-nowrap transition">檢視並改序</button>
                    </div>
                </div>
            </section>

            <!-- 手牌區 -->
            <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                    <h2 class="text-xl font-bold text-amber-400">我的手牌區 (<span id="hand-count">0</span> 張)</h2>
                    <button onclick="openAddCardModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded font-bold transition text-sm">+ 從清單自選加牌</button>
                </div>
                <div id="hand-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 min-h-[100px] bg-slate-900 p-4 rounded-lg border border-slate-700">
                    <p class="text-slate-500 col-span-full text-center py-6">目前沒有手牌</p>
                </div>
            </section>
        </div>

        <!-- ================= 區塊 2：檢視所有人狀態 (不同電腦同步) ================= -->
        <div id="tab-players-status" class="space-y-6 hidden">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                <h2 class="text-xl font-bold text-amber-400">目前連線中的所有玩家狀態</h2>
                <p class="text-xs text-slate-400">這裡會同步顯示所有開啟網頁並設定名稱的玩家血量與裝備。</p>
                <div id="all-players-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <p class="text-slate-500 col-span-full text-center py-8">正在載入其他玩家資料...</p>
                </div>
            </div>
        </div>

        <!-- 彈窗：檢視與調整順序 -->
        <div id="modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 p-4">
            <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-xl p-6 max-h-[90vh] flex flex-col">
                <h3 id="modal-title" class="text-xl font-bold text-amber-400 mb-4">調整牌序</h3>
                <p class="text-xs text-slate-400 mb-2">提示：點擊上下按鈕改變順序，最上方代表牌堆頂端。</p>
                <div id="modal-card-list" class="space-y-2 overflow-y-auto flex-grow pr-2 my-2"></div>
                <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-slate-700">
                    <button onclick="closeModal('modal')" class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded transition">取消</button>
                    <button onclick="saveCardOrder()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded font-bold transition">確認儲存新順序</button>
                </div>
            </div>
        </div>

        <!-- 彈窗：從清單自選加牌 -->
        <div id="add-card-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 p-4">
            <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-xl p-6 max-h-[90vh] flex flex-col">
                <h3 class="text-xl font-bold text-amber-400 mb-2">從完整 161 張牌清單中挑選</h3>
                <input type="text" id="card-search-input" oninput="filterCardList()" placeholder="搜尋卡牌名稱或花色..." class="bg-slate-900 border border-slate-600 rounded px-3 py-2 w-full text-white mb-3">
                <div id="master-select-list" class="space-y-2 overflow-y-auto flex-grow pr-2 my-2"></div>
                <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-slate-700">
                    <button onclick="closeModal('add-card-modal')" class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded transition">關閉</button>
                </div>
            </div>
        </div>
    </div>

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // 摸牌功能 (支援牌堆頂/底、多張)
        function drawCards(position) {
            const countInputId = position === 'top' ? 'draw-top-count' : 'draw-bottom-count';
            let count = parseInt(document.getElementById(countInputId).value);

            if (isNaN(count) || count <= 0) {
                alert("請輸入有效的摸牌數量！");
                return;
            }

            deckRef.transaction((deck) => {
                if (!deck || deck.length === 0) return deck;
                let actualDrawCount = Math.min(count, deck.length);
                let drawnCards = [];

                for (let i = 0; i < actualDrawCount; i++) {
                    if (position === 'top') {
                        drawnCards.push(deck.shift());
                    } else {
                        drawnCards.push(deck.pop());
                    }
                }
                window.tempDrawnCards = drawnCards;
                return deck;
            }, (error, committed) => {
                if (committed && window.tempDrawnCards && window.tempDrawnCards.length > 0) {
                    if(!myData.hand) myData.hand = [];
                    myData.hand.push(...window.tempDrawnCards);
                    window.tempDrawnCards = [];
                    saveMyData();
                } else {
                    alert("牌堆已經空了！");
                }
            });
        }

        // 手牌互動處理 (回頂、回底、裝備、丟棄)
        function cardAction(index, action) {
            let card = myData.hand[index];
            myData.hand.splice(index, 1);

            if (action === 'discard') {
                saveMyData();
            } else if (action === 'top' || action === 'bottom') {
                saveMyData();
                deckRef.transaction((deck) => {
                    if (!deck) deck = [];
                    if (action === 'top') deck.unshift(card);
                    else deck.push(card);
                    return deck;
                });
            } else if (action === 'equip') {
                if (!myData.equipment) myData.equipment = [];
                if (myData.equipment.length >= 5) {
                    alert("裝備欄已滿 (上限 5 張)！");
                    myData.hand.push(card); // 放回手牌
                    return;
                }
                myData.equipment.push(card);
                saveMyData();
            }
        }

                item.innerHTML = `

                        <span class="font-bold ${colorClass}">${card.suit} ${card.num}</span>

                listContainer.appendChild(item);
            });

        function moveItem(btn, direction) {
            const item = btn.closest('.card-item');
            if (direction === 'up' && item.previousElementSibling) {
                item.parentNode.insertBefore(item, item.previousElementSibling);
            } else if (direction === 'down' && item.nextElementSibling) {
                item.parentNode.insertBefore(item.nextElementSibling, item);
            }
        }

        function saveCardOrder() {
            const items = document.querySelectorAll('#modal-card-list .card-item');
            let modifiedSubList = Array.from(items).map(item => JSON.parse(item.dataset.card));

            let newDeck = [...currentDeck];
            let x = modifiedSubList.length;

            if (currentViewMode === 'top') {
                newDeck.splice(0, x, ...modifiedSubList);
            } else {
                newDeck.splice(newDeck.length - x, x, ...modifiedSubList);
            }

            deckRef.set(newDeck).then(() => {
                alert("牌序已成功更新！");
                closeModal('modal');
            }).catch(error => {
                alert("更新失敗：" + error.message);
            });
        }
    </script>
</body>
</html>
