<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- 標題與狀態 -->
        <header class="text-center bg-slate-800 p-6 rounded-xl shadow-lg border border-slate-700">
            <h1 class="text-3xl font-bold text-amber-400 mb-2">三國殺牌堆與手牌系統</h1>
            <p class="text-slate-400">目前牌堆剩餘張數：<span id="pile-count" class="text-white font-bold text-xl">載入中...</span></p>
            <div id="error-msg" class="text-red-400 text-sm mt-2 font-bold"></div>
            <div class="mt-4 flex justify-center gap-4">
                <button onclick="initOrResetDeck()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded font-bold transition">強制重洗整副牌 (161張)</button>
            </div>
        </header>

        <!-- 摸牌操作面板 -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 牌堆頂 -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col space-y-3">
                <h2 class="text-lg font-semibold text-amber-300 text-center">牌堆頂操作</h2>
                <div class="flex gap-2">
                    <input type="number" id="draw-top-count" min="1" value="1" class="bg-slate-900 border border-slate-600 rounded px-3 py-1 w-20 text-center text-white">
                    <button onclick="drawCards('top')" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-2 rounded font-bold transition">從牌堆頂摸牌</button>
                </div>
                <div class="flex gap-2 pt-2 border-t border-slate-700">
                    <input type="number" id="top-x-input" min="1" value="5" class="bg-slate-900 border border-slate-600 rounded px-3 py-1 w-full text-center text-white">
                    <button onclick="viewCards('top')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1 rounded font-bold whitespace-nowrap transition">檢視並改序</button>
                </div>
            </div>

            <!-- 牌堆底 -->
            <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 flex flex-col space-y-3">
                <h2 class="text-lg font-semibold text-amber-300 text-center">牌堆底操作</h2>
                <div class="flex gap-2">
                    <input type="number" id="draw-bottom-count" min="1" value="1" class="bg-slate-900 border border-slate-600 rounded px-3 py-1 w-20 text-center text-white">
                    <button onclick="drawCards('bottom')" class="flex-1 bg-amber-600 hover:bg-amber-700 text-white py-2 rounded font-bold transition">從牌堆底摸牌</button>
                </div>
                <div class="flex gap-2 pt-2 border-t border-slate-700">
                    <input type="number" id="bottom-x-input" min="1" value="5" class="bg-slate-900 border border-slate-600 rounded px-3 py-1 w-full text-center text-white">
                    <button onclick="viewCards('bottom')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-1 rounded font-bold whitespace-nowrap transition">檢視並改序</button>
                </div>
            </div>
        </section>

        <!-- 手牌區 -->
        <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
                <h2 class="text-xl font-bold text-amber-400">我的手牌區 (<span id="hand-count">0</span> 張)</h2>
                <button onclick="openAddCardModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded font-bold transition text-sm">+ 從清單自選加牌</button>
            </div>
            <!-- 手牌展示清單 -->
            <div id="hand-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 min-h-[100px] bg-slate-900 p-4 rounded-lg border border-slate-700">
                <p class="text-slate-500 col-span-full text-center py-6">目前沒有手牌</p>
            </div>
        </section>

        <!-- 彈窗：檢視與調整順序 -->
        <div id="modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 p-4">
            <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-xl p-6 max-h-[90vh] flex flex-col">
                <h3 id="modal-title" class="text-xl font-bold text-amber-400 mb-4">調整牌序</h3>
                <p class="text-xs text-slate-400 mb-2">提示：點擊上下按鈕改變順序，最上方代表牌堆頂端。</p>
                <div id="modal-card-list" class="space-y-2 overflow-y-auto flex-grow pr-2 my-2"></div>
                <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-slate-700">
                    <button onclick="closeModal('modal')" class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded transition">取消</button>
                    <button onclick="saveCardOrder()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded font-bold transition">確認儲存新順序</button>
                </div>
            </div>
        </div>

        <!-- 彈窗：從清單自選加牌 -->
        <div id="add-card-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 p-4">
            <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-xl p-6 max-h-[90vh] flex flex-col">
                <h3 class="text-xl font-bold text-amber-400 mb-2">從完整 161 張牌清單中挑選</h3>

                <div class="flex justify-end gap-3 mt-4 pt-4 border-t border-slate-700">
                    <button onclick="closeModal('add-card-modal')" class="bg-slate-600 hover:bg-slate-700 text-white px-4 py-2 rounded transition">關閉</button>
                </div>
            </div>
        </div>
    </div>

            {suit: "黑桃", num: "2", name: "藤甲", type: "裝備牌（防具）"},
            {suit: "梅花", num: "2", name: "八卦陣", type: "裝備牌（防具）"},
            {suit: "梅花", num: "2", name: "仁王盾", type: "裝備牌（防具）"},
            {suit: "梅花", num: "2", name: "藤甲", type: "裝備牌（防具）"},
            {suit: "梅花", num: "A", name: "白銀獅子", type: "裝備牌（防具）"},
            {suit: "黑桃", num: "5", name: "絕影 (+1)", type: "裝備牌（坐騎）"},
            {suit: "黑桃", num: "K", name: "大宛 (-1)", type: "裝備牌（坐騎）"},
            {suit: "紅桃", num: "5", name: "赤兔 (-1)", type: "裝備牌（坐騎）"},
            {suit: "紅桃", num: "K", name: "爪黃飛電 (+1)", type: "裝備牌（坐騎）"},
            {suit: "梅花", num: "5", name: "的盧 (+1)", type: "裝備牌（坐騎）"},
            {suit: "方塊", num: "K", name: "紫騂 (-1)", type: "裝備牌（坐騎）"},
            {suit: "方塊", num: "K", name: "驊骝 (+1)", type: "裝備牌（坐騎）"},
            {suit: "方塊", num: "5", name: "木牛流馬", type: "裝備牌（寶物）"}
        ];

        let currentDeck = [];
        let currentHand = [];
        let currentViewMode = '';

        // 監聽牌堆
        deckRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                initOrResetDeck();
            } else {
                currentDeck = data;
                document.getElementById('pile-count').innerText = currentDeck.length;
                document.getElementById('error-msg').innerText = '';
            }
        });

        // 監聽手牌區
        handRef.on('value', (snapshot) => {
            const data = snapshot.val();
            currentHand = data ? data : [];
            renderHandCards();
        });

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initOrResetDeck() {
            let shuffled = shuffle([...masterDeckData]);
            deckRef.set(shuffled);
        }

        // 摸多張牌功能
        function drawCards(position) {
            const countInputId = position === 'top' ? 'draw-top-count' : 'draw-bottom-count';
            let count = parseInt(document.getElementById(countInputId).value);

            if (isNaN(count) || count <= 0) {
                alert("請輸入有效的摸牌數量！");
                return;
            }

            deckRef.transaction((deck) => {
                if (!deck || deck.length === 0) return deck;
                
                let actualDrawCount = Math.min(count, deck.length);
                let drawnCards = [];

                for (let i = 0; i < actualDrawCount; i++) {
                    if (position === 'top') {
                        drawnCards.push(deck.shift());
                    } else {
                        drawnCards.push(deck.pop());
                    }
                }

                // 將抽到的牌放入手牌
                if (!window.tempHandToAdd) window.tempHandToAdd = [];
                window.tempHandToAdd = drawnCards;

                return deck;
            }, (error, committed) => {
                if (committed && window.tempHandToAdd && window.tempHandToAdd.length > 0) {
                    // 更新到 Firebase 手牌區
                    let newHand = [...currentHand, ...window.tempHandToAdd];
                    handRef.set(newHand);
                    window.tempHandToAdd = [];
                } else {
                    alert("牌堆已經空了！");
                }
            });
        }

        // 渲染手牌區畫面
        function renderHandCards() {
            const container = document.getElementById('hand-container');
            document.getElementById('hand-count').innerText = currentHand.length;
            container.innerHTML = '';

            if (currentHand.length === 0) {
                container.innerHTML = `<p class="text-slate-500 col-span-full text-center py-6">目前沒有手牌</p>`;
                return;
            }

            currentHand.forEach((card, index) => {
                let colorClass = (card.suit === '紅桃' || card.suit === '方塊') ? 'text-red-400' : 'text-slate-200';
                const cardEl = document.createElement('div');
                cardEl.className = "bg-slate-900 border border-slate-700 rounded-lg p-3 flex flex-col justify-between shadow relative group hover:border-amber-500 transition";
                
                cardEl.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start">
                            <span class="text-xs font-bold ${colorClass}">${card.suit} ${card.num}</span>
                            <span class="text-[10px] text-slate-500">#${index + 1}</span>
                        </div>
                        <div class="text-sm font-bold text-amber-300 my-1 truncate">${card.name}</div>
                        <div class="text-[10px] text-slate-400 truncate">${card.type}</div>
                    </div>
                    <div class="flex gap-1 mt-2 pt-2 border-t border-slate-800">
                        <button onclick="discardCard(${index}, 'none')" class="flex-1 bg-red-900/60 hover:bg-red-700 text-red-200 text-xs py-1 rounded transition" title="直接丟棄">丟棄</button>
                        <button onclick="discardCard(${index}, 'bottom')" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs py-1 rounded transition" title="洗回牌堆底">回底</button>
                    </div>
                `;
                container.appendChild(cardEl);
            });
        }

        // 丟棄或洗回牌堆
        function discardCard(index, action) {
            let cardToDiscard = currentHand[index];
            currentHand.splice(index, 1);

            // 更新手牌區
            handRef.set(currentHand).then(() => {
                if (action === 'bottom') {
                    // 將牌放回牌堆底
                    deckRef.transaction((deck) => {
                        if (!deck) deck = [];
                        deck.push(cardToDiscard);
                        return deck;
                    });
                }
            });
        }

        // 開啟自選加牌彈窗
        function openAddCardModal() {
            renderMasterSelectList(masterDeckData);
            document.getElementById('add-card-modal').classList.remove('hidden');
        }

        function renderMasterSelectList(cards) {
            const listContainer = document.getElementById('master-select-list');
            listContainer.innerHTML = '';

            cards.forEach((card) => {
                let colorClass = (card.suit === '紅桃' || card.suit === '方塊') ? 'text-red-400' : 'text-slate-300';
                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-slate-900 p-3 rounded border border-slate-700 hover:bg-slate-700/50 transition cursor-pointer";
                
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="font-bold ${colorClass}">${card.suit} ${card.num}</span>
                        <span class="text-white font-medium">${card.name}</span>
                        <span class="text-xs text-slate-400">(${card.type})</span>
                    </div>
                    <button class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1 rounded font-bold">加入手牌</button>
                `;
                item.onclick = () => addSpecificCardToHand(card);
                listContainer.appendChild(item);
            });
        }

        function filterCardList() {
            const keyword = document.getElementById('card-search-input').value.toLowerCase();
            const filtered = masterDeckData.filter(card => 
                card.name.toLowerCase().includes(keyword) || 
                card.suit.toLowerCase().includes(keyword) || 
                card.type.toLowerCase().includes(keyword)
            );
            renderMasterSelectList(filtered);
        }

        function addSpecificCardToHand(card) {
            let newHand = [...currentHand, card];
            handRef.set(newHand);
            closeModal('add-card-modal');
        }

        // 檢視牌堆頂/底
        function viewCards(position) {
            currentViewMode = position;
            const inputId = position === 'top' ? 'top-x-input' : 'bottom-x-input';
            let x = parseInt(document.getElementById(inputId).value);

            if (isNaN(x) || x <= 0) {
                alert("請輸入有效的正整數！");
                return;
            }
            if (currentDeck.length === 0) {
                alert("牌堆目前是空的！");
                return;
            }

            x = Math.min(x, currentDeck.length);
            let targetCards = (position === 'top') ? currentDeck.slice(0, x) : currentDeck.slice(currentDeck.length - x);

            renderModalList(targetCards, position);
            document.getElementById('modal').classList.remove('hidden');
        }

        function renderModalList(cards, position) {
            const title = document.getElementById('modal-title');
            title.innerText = position === 'top' ? `檢視並調整牌堆頂的 ${cards.length} 張牌` : `檢視並調整牌堆底的 ${cards.length} 張牌`;

            const listContainer = document.getElementById('modal-card-list');
            listContainer.innerHTML = '';

            cards.forEach((card, index) => {
                let colorClass = (card.suit === '紅桃' || card.suit === '方塊') ? 'text-red-400' : 'text-slate-300';
                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-slate-900 p-3 rounded border border-slate-700 card-item";
                item.dataset.card = JSON.stringify(card);

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-slate-500 font-mono">#${index + 1}</span>
                        <span class="font-bold ${colorClass}">${card.suit} ${card.num}</span>
                        <span class="text-white">${card.name}</span>
                        <span class="text-xs text-slate-400">(${card.type})</span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="moveItem(this, 'up')" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 text-xs rounded">⬆️</button>
                        <button onclick="moveItem(this, 'down')" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 text-xs rounded">⬇️</button>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        function moveItem(btn, direction) {
            const item = btn.closest('.card-item');
            if (direction === 'up' && item.previousElementSibling) {
                item.parentNode.insertBefore(item, item.previousElementSibling);
            } else if (direction === 'down' && item.nextElementSibling) {
                item.parentNode.insertBefore(item.nextElementSibling, item);
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        function saveCardOrder() {
            const items = document.querySelectorAll('#modal-card-list .card-item');
            let modifiedSubList = Array.from(items).map(item => JSON.parse(item.dataset.card));

            let newDeck = [...currentDeck];
            let x = modifiedSubList.length;

            if (currentViewMode === 'top') {
                newDeck.splice(0, x, ...modifiedSubList);
            } else {
                newDeck.splice(newDeck.length - x, x, ...modifiedSubList);
            }

            deckRef.set(newDeck).then(() => {
                alert("牌序已成功更新！");
                closeModal('modal');
            }).catch(error => {
                alert("更新失敗：" + error.message);
            });
        }
    </script>
</body>
</html>
